services:
  krokbot:
    build: .
    container_name: krokbot_agent
    restart: unless-stopped
    ports:
      - "5150:5150"
      - "8990:8990"
    volumes:
      - ./data:/app/data
      - ./krokbot_health_report.md:/app/krokbot_health_report.md
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - LLAMACPP_HOST=http://llamacpp:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - llamacpp

  llamacpp:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp
    container_name: krokbot_llamacpp
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./models:/app/models
